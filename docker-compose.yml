version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-prep-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: prepuser
      POSTGRES_PASSWORD: preppass
      POSTGRES_DB: interview_prep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepuser -d interview_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
